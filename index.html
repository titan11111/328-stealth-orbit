<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STEALTH ORBIT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#04070c;--panel:#0b1119;--line:#1c2b3a;--fg:#e2ecf4;--dim:#8196aa;--acc:#4ff2b4;--warn:#ffb340;--crit:#ff4d5e;
  --f-d:'Chakra Petch','Noto Sans JP',system-ui,sans-serif;--f-b:'Noto Sans JP',system-ui,-apple-system,sans-serif;color-scheme:dark;--dp:150px;--bt:80px}
*,*::before,*::after{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;touch-action:none}
html{box-sizing:border-box;height:100%}
body{height:100%;box-sizing:border-box;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);padding-block:6px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;gap:6px;grid-template-columns:minmax(0,7fr) minmax(0,3fr);grid-template-rows:minmax(0,1fr)}
@media (orientation:portrait){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,7fr) minmax(0,3fr)}}
.stage{position:relative;min-width:0;min-height:0;background:#000;border:1px solid var(--line);overflow:hidden;--mm:min(27vmin,130px)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.vig{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 90px 24px var(--crit);z-index:2}
.hud{position:absolute;left:6px;right:6px;top:6px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;z-index:3}
.hud[hidden],.hudb[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{font:600 10px/1 var(--f-d);letter-spacing:.04em;padding:6px;background:rgba(4,7,12,.72);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.pl{color:var(--fg);border-color:#3b5266}
.chip.ok{border-color:var(--acc);color:var(--acc)}
.mute{pointer-events:auto;align-self:flex-start;border:1px solid var(--line);background:rgba(11,17,25,.85);padding:7px 9px;font:600 10px/1 var(--f-d);cursor:pointer}
.mute[aria-pressed="false"]{color:var(--dim)}
.hudb{position:absolute;left:6px;bottom:6px;width:min(36%,150px);padding:6px 7px;background:rgba(4,7,12,.72);border:1px solid var(--line);pointer-events:none;z-index:3}
.hudb label{display:flex;justify-content:space-between;font:600 9px/1 var(--f-d);letter-spacing:.08em;color:var(--dim);margin-bottom:3px}
.hudb b{color:var(--fg)}
.bar{height:6px;background:#050a10;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--warn)}
.scanw{position:absolute;left:50%;bottom:calc(var(--mm) + 10px);transform:translateX(-50%);width:min(60%,260px);z-index:3;pointer-events:none;opacity:0;transition:opacity .15s}
.scanw.on{opacity:1}
.scanw .bar{height:10px;border-color:#2c7d8f}.scanw .bar i{background:#58d8ff}
.scanw span{display:block;text-align:center;font:700 11px/1 var(--f-b);margin-bottom:4px;color:#9fe8ff}
.minimap{position:absolute;right:6px;bottom:6px;width:var(--mm);pointer-events:none;z-index:3}
#rd{width:100%;aspect-ratio:1;display:block;background:rgba(2,10,8,.82);border:1px solid #11382b}
.guide{position:absolute;left:0;top:0;z-index:3;pointer-events:none;width:0;height:0}
.guide[hidden]{display:none}
.guide i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;display:block;background:var(--acc);clip-path:polygon(100% 50%,0 0,22% 50%,0 100%);filter:drop-shadow(0 0 6px rgba(79,242,180,.8))}
.guide span{position:absolute;left:0;top:0;transform:translate(-50%,22px);white-space:nowrap;font:700 11px/1 var(--f-b);padding:4px 7px;background:rgba(4,7,12,.85);border:1px solid var(--acc);color:var(--acc)}
.banner{position:absolute;left:50%;top:42px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);text-align:center;padding:9px 14px;font:700 14px/1.35 var(--f-b);background:rgba(4,7,12,.86);border:1px solid var(--line);pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}
.banner.show{opacity:1}.banner.warn{border-color:var(--warn);color:var(--warn)}.banner.crit{border-color:var(--crit);color:var(--crit)}.banner.good{border-color:var(--acc);color:var(--acc)}
.nogl{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:20px;text-align:center;font-size:13px;color:var(--warn);background:#000}
.nogl[hidden]{display:none}
/* overlays */
.ov{position:absolute;inset:0;z-index:5;display:flex;padding:16px;overflow:auto;touch-action:pan-y}
.ov[hidden]{display:none}
.ov.dim{background:linear-gradient(180deg,rgba(2,4,9,.55),rgba(2,4,9,.8))}
.card{margin:auto;width:min(520px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.eyebrow{font:600 11px/1 var(--f-d);letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
.ttl{margin:0;font:700 clamp(30px,9.5vw,58px)/1 var(--f-d);letter-spacing:.16em;padding-left:.16em;color:#fff;text-shadow:0 0 28px rgba(79,242,180,.35)}
.ttl em{font-style:normal;color:var(--acc)}
.sub{margin:0;font-size:14px;line-height:1.7;color:#c4d3df}
.route{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--f-d);letter-spacing:.08em;color:var(--dim);flex-wrap:wrap;justify-content:center}
.route b{font-weight:600;padding:6px 9px;border:1px solid #2b3d4e;border-radius:99px}
.route s{display:block;width:14px;height:1px;background:#2b3d4e}
button{transition:transform .08s ease,filter .08s ease}
button:active{transform:scale(0.92)}
.go{padding:16px 40px;font:700 18px/1 var(--f-d);letter-spacing:.2em;padding-left:calc(40px + .2em);color:#03120d;background:var(--acc);border:0;border-radius:99px;cursor:pointer;touch-action:none;box-shadow:0 0 26px rgba(79,242,180,.35)}
.go:focus-visible,.mute:focus-visible{outline:2px solid #fff;outline-offset:2px}
.keys{font-size:11.5px;line-height:1.7;color:var(--dim)}
.keys b{color:var(--acc);font-weight:700}
.big{margin:0;font:700 clamp(26px,8vw,44px)/1.1 var(--f-d);letter-spacing:.1em}
.tg{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13px;color:#c4d3df}
.tg li::before{content:"◎ ";color:var(--acc)}
.res{font:600 13px/1.9 var(--f-d);letter-spacing:.06em;font-variant-numeric:tabular-nums}.res b{color:var(--acc)}
.fly{font-size:12px;line-height:1.7;color:var(--dim);max-width:34em}
#ovEnd{background:radial-gradient(ellipse at 50% 100%,rgba(5,10,24,.2),rgba(2,4,9,.78))}
.endl{opacity:0;transform:translateY(8px);animation:up 1.2s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.endl{animation-duration:.01s}}
/* controller 30% */
.panel{min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);padding:4px 10px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;overflow:hidden;gap:8px}
@media (orientation:landscape){.panel{flex-direction:column;justify-content:space-around;padding:6px}}
.dpad{position:relative;flex:none;width:var(--dp);height:var(--dp);touch-action:none}
.dpad::before{content:"";position:absolute;inset:-14%}
.dp{position:absolute;background:#171210;border:1px solid #000;box-shadow:inset 0 1px 0 #3b312d}
.dp::after{content:"";position:absolute;background:#6b5b54;width:34%;height:26%;left:33%;clip-path:polygon(50% 0,0 100%,100% 100%)}
.dp.on{background:#51443e}.dp.on::after{background:#ffe9a0}
.dp.up{left:33.3%;top:0;width:33.4%;height:38%;border-radius:6px 6px 0 0}.dp.up::after{top:22%}
.dp.dn{left:33.3%;top:62%;width:33.4%;height:38%;border-radius:0 0 6px 6px}.dp.dn::after{top:52%;transform:rotate(180deg)}
.dp.lf{left:0;top:33.3%;width:38%;height:33.4%;border-radius:6px 0 0 6px}.dp.lf::after{left:20%;top:37%;width:26%;height:34%;clip-path:polygon(0 50%,100% 0,100% 100%)}
.dp.rt{left:62%;top:33.3%;width:38%;height:33.4%;border-radius:0 6px 6px 0}.dp.rt::after{left:54%;top:37%;width:26%;height:34%;clip-path:polygon(100% 50%,0 0,0 100%)}
.dc{position:absolute;left:33.3%;top:33.3%;width:33.4%;height:33.4%;background:#171210}
.dc::after{content:"";position:absolute;inset:22%;border-radius:50%;background:#0a0706;box-shadow:inset 0 1px 2px #000}
.abz{position:relative;flex:1;align-self:stretch;min-width:0}
@media (orientation:landscape){.abz{flex:none;width:100%;height:var(--abh,120px);align-self:auto}}
.abc{position:absolute;left:50%;top:50%;width:calc(var(--bt)*2.12);height:calc(var(--bt)*1.92);transform:translate(-50%,-50%)}
.rb{position:absolute;width:var(--bt);height:var(--bt);border-radius:50%;border:2px solid #2a0a0c;padding:0;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 35% 30%,#f2605f 0,#c82a30 55%,#8f1a21 100%);box-shadow:inset 0 -4px 5px rgba(0,0,0,.35),0 4px 0 #1b0708;color:#fff4e0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-d);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.rb::before{content:"";position:absolute;inset:-7px;border-radius:50%}
.rb b{font-size:calc(var(--bt)*.36);line-height:1}
.rb small{font:700 calc(var(--bt)*.15)/1 var(--f-b)}
.rb.held{transform:translateY(4px) scale(0.92);box-shadow:inset 0 3px 6px rgba(0,0,0,.5);filter:brightness(.85)}
.rb.bA{right:0;bottom:0}
.rb.bB{left:0;bottom:0;background:radial-gradient(circle at 35% 30%,#d070f0 0,#9a2fc4 55%,#5f1a82 100%);border-color:#240a30;box-shadow:inset 0 -4px 5px rgba(0,0,0,.35),0 4px 0 #14061c}
.rb.bC{left:50%;margin-left:calc(var(--bt)/-2);top:0;background:radial-gradient(circle at 35% 30%,#7fd6ff 0,#2f94d8 55%,#1a5a96 100%);border-color:#0a2238;box-shadow:inset 0 -4px 5px rgba(0,0,0,.35),0 4px 0 #061420}
</style>

      <button class="go" id="goBtn" type="button">はじめる</button>

    </div></div>

    <div class="ov dim" id="ovIntro" hidden><div class="card">
      <div class="eyebrow" id="inNo">MISSION 1 / 4</div>
      <h2 class="big" id="inName">水星</h2>
      <p class="fly" id="inEv"></p>
      <p class="sub" id="inFl"></p>
      <ul class="tg" id="inTg"></ul>
      <button class="go" id="dropBtn" type="button">降下開始</button>
    </div></div>

    <div class="ov" id="ovGas" hidden><div class="card" style="margin-top:auto;margin-bottom:6px;background:linear-gradient(180deg,rgba(2,4,9,0),rgba(2,4,9,.78) 28%);padding-top:34px;border-radius:12px">
      <div class="eyebrow" id="gsNo">GAS GIANTS</div><h2 class="big" id="gsName">木星</h2><p class="sub" id="gsTx"></p>
      <button class="go" id="gsBtn" type="button">つぎへ</button>
    </div></div>

    <div class="ov dim" id="ovClear" hidden><div class="card">
      <div class="eyebrow">MISSION COMPLETE</div>
      <h2 class="big" id="clName">調査完了</h2>
      <div class="res" id="clRes"></div>
      <button class="go" id="nextBtn" type="button">次の星へ</button>
    </div></div>

    <div class="ov dim" id="ovOver" hidden><div class="card">
      <div class="eyebrow" style="color:var(--crit)">MISSION FAILED</div>
      <h2 class="big" id="ovTitleTx">通報された…</h2>
      <p class="sub" id="ovMsg"></p>
      <button class="go" id="retryBtn" type="button">もう一度</button>
    </div></div>

    <div class="ov" id="ovEnd" hidden><div class="card" id="endCard"></div></div>
    <div class="ov dim" id="ovPause" hidden><div class="card"><h2 class="big">一時停止</h2><button class="go" id="resumeBtn" type="button">再開</button></div></div>
    <div class="hud" id="hud" hidden><div class="chips" id="chips"></div><button class="mute" id="pauseBtn" type="button" aria-pressed="false" aria-label="一時停止">停止</button><button class="mute" id="mute" type="button" aria-pressed="true">音 ON</button></div>
    <div class="minimap"><canvas id="rd" width="220" height="220"></canvas></div>
    <canvas id="gl"></canvas>
  </div>

  <aside class="panel" id="panel" aria-label="コントローラー">
    <div class="dpad" id="dpad"><i class="dp up"></i><i class="dp dn"></i><i class="dp lf"></i><i class="dp rt"></i><i class="dc"></i></div>
    <div class="abz" id="abz"><div class="abc">
      <button class="rb bC" id="btC" type="button" aria-label="のぼる（C）押しているあいだ高くとぶ"><b>C</b><small>のぼる</small></button>
      <button class="rb bB" id="btB" type="button" aria-label="ビーム（B）"><b>B</b><small>ビーム</small></button>
      <button class="rb bA" id="btA" type="button" aria-label="しらべる（A）押しっぱなし"><b>A</b><small>しらべる</small></button>
    </div></div>
  </aside>
</div>
